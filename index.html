<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Central de Dashboards</title>
  <style>
    /* --- Reset e Base --- */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html, body { 
      height: 100%; 
      width: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      background: #0f172a; 
      color: #e2e8f0; 
      overflow: hidden; 
      display: flex;
      flex-direction: column;
    }
    
    /* --- Header --- */
    header { 
      background: #1e293b; 
      padding: clamp(10px, 2vh, 16px) clamp(12px, 3vw, 24px); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid #334155; 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      z-index: 10;
      flex-shrink: 0;
      gap: 12px;
      /* Respeita safe area de aparelhos com notch */
      padding-top: max(10px, env(safe-area-inset-top));
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
    }
    
    h1 { 
      font-size: clamp(1rem, 4vw, 1.25rem); 
      font-weight: 700; 
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    
    /* --- Navegação (Abas) --- */
    .nav-tabs { 
      display: flex; 
      gap: 8px; 
      overflow-x: auto; 
      scrollbar-width: none; 
      -ms-overflow-style: none; 
      -webkit-overflow-scrolling: touch;
      padding: 4px 0;
      max-width: 100%;
    }
    .nav-tabs::-webkit-scrollbar { 
      display: none; 
    }

    .tab-btn { 
      background: transparent; 
      color: #94a3b8; 
      border: 1px solid transparent;
      padding: 10px 16px; 
      min-height: 44px; /* Tamanho mínimo de toque recomendado (Apple/Google) */
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 0.875rem; 
      font-weight: 600; 
      transition: all 0.25s ease; 
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .tab-btn:hover { 
      background: #334155; 
      color: #f1f5f9; 
    }
    
    .tab-btn.active { 
      background: #2563eb; 
      color: #ffffff; 
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      border-color: #3b82f6;
    }
    
    /* --- Área Principal --- */
    main { 
      flex: 1; 
      position: relative; 
      background: #f1f5f9; 
      width: 100%;
      height: 100%;
    }
    
    .view-container { 
      display: none; 
      width: 100%; 
      height: 100%; 
      position: relative;
    }
    
    .view-container.active { 
      display: block; 
    }
    
    /* --- Iframe --- */
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      background: #ffffff;
      opacity: 0; 
      transition: opacity 0.4s ease;
    }
    
    iframe.loaded {
      opacity: 1;
    }

    /* --- Loader (Spinner) --- */
    .loader-overlay {
      position: absolute;
      inset: 0;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 5;
      transition: opacity 0.3s ease;
      padding: 16px;
      text-align: center;
    }
    
    .loader-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loader-text {
      margin-top: 16px;
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 500;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* --- Responsividade Mobile (Telas pequenas) --- */
    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: stretch;
        padding-bottom: 8px;
      }

      h1 { 
        justify-content: center;
      }

      .nav-tabs { 
        width: 100%;
        justify-content: flex-start;
      }

      .tab-btn {
        padding: 8px 14px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>📊 Central de Gerenciamento</h1>
    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="carregarAba('dash1', 'https://script.google.com/macros/s/AKfycbzdF-4C2magvZ4HE_CPIYZ3KD43bSEJ5Pa3ndcDvDnr/exec', this)">Abastecimento</button>
      <button class="tab-btn" onclick="carregarAba('dash2', 'https://script.google.com/macros/s/AKfycbxDZysCb69Tr6XbG1gG3fplih8rDjZ3YfZ32moZUBxdkVeIdH4QL9vuGZ2lc1l3OY_L/exec', this)">Ordem de serviço</button>
      <button class="tab-btn" onclick="carregarAba('dash3', 'https://script.google.com/macros/s/AKfycbzjLdtCwTjHWfGAgmwm74e4OLkDWnoUU0d5D9Sc3ukqYhXwq5ZeNIT_w5oDqeJcnlgB0A/exec', this)">Controle de ponto</button>
      <button class="tab-btn" onclick="carregarAba('dash4', 'https://script.google.com/macros/s/AKfycbxBh25gAKneY5wq9JnyWFynz91_pR_eVQG1EXGyl837tGhngfPVaJX4K0s8P51-sqegCg/exec', this)">Roteiro</button>
    </nav>
  </header>

  <main>
    <!-- Painel 1: Abastecimento -->
    <div id="dash1" class="view-container active">
      <div class="loader-overlay" id="loader-dash1">
        <div class="spinner"></div>
        <span class="loader-text">Carregando Abastecimento...</span>
      </div>
      <iframe id="iframe-dash1" src="https://script.google.com/macros/s/AKfycbzdF-4C2magvZ4HE_CPIYZ3KD43bSEJ5Pa3ndcDvDnr/exec" onload="esconderLoader('dash1')"></iframe>
    </div>

    <!-- Painel 2: Ordem de Serviço -->
    <div id="dash2" class="view-container">
      <div class="loader-overlay" id="loader-dash2">
        <div class="spinner"></div>
        <span class="loader-text">Carregando Ordem de Serviço...</span>
      </div>
      <iframe id="iframe-dash2" src="about:blank" onload="esconderLoader('dash2')"></iframe>
    </div>

    <!-- Painel 3: Controle de Ponto -->
    <div id="dash3" class="view-container">
      <div class="loader-overlay" id="loader-dash3">
        <div class="spinner"></div>
        <span class="loader-text">Carregando Controle de Ponto...</span>
      </div>
      <iframe id="iframe-dash3" src="about:blank" onload="esconderLoader('dash3')"></iframe>
    </div>

    <!-- Painel 4: Roteiro -->
    <div id="dash4" class="view-container">
      <div class="loader-overlay" id="loader-dash4">
        <div class="spinner"></div>
        <span class="loader-text">Carregando Roteiro...</span>
      </div>
      <iframe id="iframe-dash4" src="about:blank" onload="esconderLoader('dash4')"></iframe>
    </div>
  </main>

  <script>
    function carregarAba(idContainer, url, btn) {
      // 1. Oculta todos os painéis e remove estado ativo dos botões
      document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      // 2. Ativa o painel selecionado e seu botão correspondente
      const container = document.getElementById(idContainer);
      container.classList.add('active');
      btn.classList.add('active');

      // Centraliza suavemente a aba clicada na barra de rolagem (mobile)
      btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

      // 3. Lazy Loading do iframe
      const iframe = document.getElementById('iframe-' + idContainer);
      const loader = document.getElementById('loader-' + idContainer);
      
      const currentSrc = iframe.getAttribute('src');
      if (!currentSrc || currentSrc === 'about:blank') {
        if (loader) loader.classList.remove('hidden');
        iframe.classList.remove('loaded');
        iframe.src = url;
      }
    }

    function esconderLoader(idContainer) {
      const loader = document.getElementById('loader-' + idContainer);
      const iframe = document.getElementById('iframe-' + idContainer);
      
      if (loader) loader.classList.add('hidden');
      if (iframe) iframe.classList.add('loaded');
    }

    // Esconde o loader inicial da primeira aba após o carregamento
    window.addEventListener('load', () => {
      setTimeout(() => {
        esconderLoader('dash1');
      }, 500);
    });
  </script>
</body>
</html>
