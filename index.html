<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Dashboards</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #0f172a; color: white; }
    
    header { background: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    h1 { font-size: 1.1rem; font-weight: 600; }
    
    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn { background: #334155; color: #94a3b8; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
    .tab-btn.active { background: #007bff; color: white; }
    
    main { flex: 1; position: relative; background: #f8fafc; }
    .view-container { display: none; width: 100%; height: 100%; }
    .view-container.active { display: block; }
    
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <header>
    <h1>📊 Central de Gerenciamento</h1>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="carregarAba('dash1', 'https://script.google.com/macros/s/AKfycbx-TooQFre7c2DizZNXrnIWE4OcvP1rnQc5aafSQK1zulvPM-o5miv--DJ9ZKKwaLcAuA/exec', this)">Painel 1</button>
      <button class="tab-btn" onclick="carregarAba('dash2', 'https://script.google.com/macros/s/AKfycbxDZysCb69Tr6XbG1gG3fplih8rDjZ3YfZ32moZUBxdkVeIdH4QL9vuGZ2lc1l3OY_L/exec', this)">Painel 2</button>
    </div>
  </header>

  <main>
    <div id="dash1" class="view-container active">
      <iframe id="iframe-dash1" src="https://script.google.com/macros/s/AKfycbx-TooQFre7c2DizZNXrnIWE4OcvP1rnQc5aafSQK1zulvPM-o5miv--DJ9ZKKwaLcAuA/exec"></iframe>
    </div>

    <div id="dash2" class="view-container">
      <iframe id="iframe-dash2" src="about:blank"></iframe>
    </div>
  </main>

  <script>
    function carregarAba(idContainer, url, btn) {
      // Oculta abas e inativa botões
      document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      // Ativa container e botão
      const container = document.getElementById(idContainer);
      container.classList.add('active');
      btn.classList.add('active');

      // Carrega a URL no iframe apenas ao clicar
      const iframe = document.getElementById('iframe-' + idContainer);
      if (iframe.src === 'about:blank' || iframe.src === '') {
        iframe.src = url;
      }
    }
  </script>
</body>
</html>
