<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Dashboards</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; padding: 30px 20px; }
    
    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 2rem; color: #1e293b; margin-bottom: 8px; }
    header p { color: #64748b; font-size: 0.95rem; }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .card-title { font-size: 1.2rem; font-weight: 600; color: #0f172a; margin-bottom: 10px; }
    .card-desc { font-size: 0.875rem; color: #64748b; margin-bottom: 20px; line-height: 1.4; }

    .btn {
      display: inline-block;
      text-align: center;
      background-color: #007bff;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s;
    }

    .btn:hover { background-color: #0056b3; }
  </style>
</head>
<body>

  <header>
    <h1>📊 Central de Gerenciamento</h1>
    <p>Selecione o painel que deseja acessar</p>
  </header>

  <div class="grid-container">
    <!-- Card 1 -->
    <div class="card">
      <div>
        <div class="card-title">Painel 1</div>
        <div class="card-desc">Acesso direto ao primeiro sistema de monitoramento e relatórios do Apps Script.</div>
      </div>
      <a class="btn" href="https://script.google.com/macros/s/AKfycbx-TooQFre7c2DizZNXrnIWE4OcvP1rnQc5aafSQK1zulvPM-o5miv--DJ9ZKKwaLcAuA/exec" target="_blank">Abrir Painel 1 ↗</a>
    </div>

    <!-- Card 2 -->
    <div class="card">
      <div>
        <div class="card-title">Painel 2 (Endereços)</div>
        <div class="card-desc">Acesso ao painel de gerenciamento, controle de ocorrências e indicadores.</div>
      </div>
      <a class="btn" href="https://script.google.com/macros/s/AKfycbxDZysCb69Tr6XbG1gG3fplih8rDjZ3YfZ32moZUBxdkVeIdH4QL9vuGZ2lc1l3OY_L/exec" target="_blank">Abrir Painel 2 ↗</a>
    </div>
  </div>

</body>
</html>
