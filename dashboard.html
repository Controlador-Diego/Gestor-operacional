<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Painéis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    
    .container { max-width: 800px; width: 100%; }
    .header { text-align: center; margin-bottom: 40px; }
    .header h1 { font-size: 2rem; margin-bottom: 8px; color: #fff; }
    .header p { color: #94a3b8; font-size: 0.95rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.2s; }
    .card:hover { border-color: #38bdf8; transform: translateY(-3px); }
    
    .card h2 { font-size: 1.25rem; color: #38bdf8; margin-bottom: 10px; }
    .card p { font-size: 0.875rem; color: #94a3b8; line-height: 1.5; margin-bottom: 20px; }
    
    .btn { display: inline-block; text-align: center; background: #0284c7; color: white; text-decoration: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; transition: background 0.2s; }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🚀 Central de Gerenciamento</h1>
      <p>Selecione o painel que deseja acessar</p>
    </div>

    <div class="grid">
      <div class="card">
        <div>
          <h2>Painel 1</h2>
          <p>Acesso ao primeiro sistema de monitoramento e relatórios do Apps Script.</p>
        </div>
        <a href="https://script.google.com/macros/s/AKfycbx-TooQFre7c2DizZNXrnIWE4OcvP1rnQc5aafSQK1zulvPM-o5miv--DJ9ZKKwaLcAuA/exec" target="_blank" class="btn">Abrir Painel 1 ↗</a>
      </div>

      <div class="card">
        <div>
          <h2>Painel 2 (Endereços)</h2>
          <p>Acesso ao painel de gerenciamento de endereços, ocorrências e indicadores.</p>
        </div>
        <a href="https://script.google.com/macros/s/AKfycbxDZysCb69Tr6XbG1gG3fplih8rDjZ3YfZ32moZUBxdkVeIdH4QL9vuGZ2lc1l3OY_L/exec" target="_blank" class="btn">Abrir Painel 2 ↗</a>
      </div>
    </div>
  </div>

</body>
</html>
