<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Dashboards</title>
  <style>
    :root {
      --primary-color: #007bff;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Cabeçalho / Barra Navegação */
    header {
      background: #1e293b;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Botões de Navegação (Abas) */
    .nav-tabs {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #ccc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    /* Área Principal dos Dashboards */
    main {
      flex: 1;
      position: relative;
      background: #e2e8f0;
      display: flex;
    }

    .view-container {
      display: none;
      width: 100%;
      height: 100%;
    }

    .view-container.active {
      display: flex;
    }

    /* Container Modo Split (Lado a Lado) */
    .split-view {
      flex-direction: row;
      gap: 10px;
      padding: 10px;
    }

    .dashboard-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .card-header {
      background: #f8fafc;
      padding: 10px 15px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
    }

    .card-header a {
      color: var(--primary-color);
      text-decoration: none;
      font-size: 12px;
    }

    .card-header a:hover {
      text-decoration: underline;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Responsividade para Celulares */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
      }

      .nav-tabs {
        justify-content: space-between;
      }

      .tab-btn {
        flex: 1;
        padding: 8px 5px;
        font-size: 11px;
        text-align: center;
      }

      .split-view {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>📊 Central de Gerenciamento</h1>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="mostrarAba('dash1', this)">Painel 1</button>
      <button class="tab-btn" onclick="mostrarAba('dash2', this)">Painel 2</button>
      <button class="tab-btn" onclick="mostrarAba('dash-split', this)">⚡ Ambos (Lado a Lado)</button>
    </div>
  </header>

  <main>
    <!-- Aba 1: Primeiro Dashboard em Tela Cheia -->
    <div id="dash1" class="view-container active">
      <div class="dashboard-card" style="border-radius: 0;">
        <iframe src="https://script.google.com/macros/s/AKfycbx-TooQFre7c2DizZNXrnIWE4OcvP1rnQc5aafSQK1zulvPM-o5miv--DJ9ZKKwaLcAuA/exec"></iframe>
      </div>
    </div>

    <!-- Aba 2: Segundo Dashboard em Tela Cheia -->
    <div id="dash2" class="view-container">
      <div class="dashboard-card" style="border-radius: 0;">
        <iframe src="https://script.google.com/macros/s/AKfycbxDZysCb69Tr6XbG1gG3fplih8rDjZ3YfZ32moZUBxdkVeIdH4QL9vuGZ2lc1l3OY_L/exec"></iframe>
      </div>
    </div>

    <!-- Aba 3: Modo Dividido (Ambos lado a lado) -->
    <div id="dash-split" class="view-container split-view">
      <div class="dashboard-card">
        <div class="card-header">
          <span>Painel 1</span>
          <a href="https://script.google.com/macros/s/AKfycbx-TooQFre7c2DizZNXrnIWE4OcvP1rnQc5aafSQK1zulvPM-o5miv--DJ9ZKKwaLcAuA/exec" target="_blank">Abrir em nova aba ↗</a>
        </div>
        <iframe src="https://script.google.com/macros/s/AKfycbx-TooQFre7c2DizZNXrnIWE4OcvP1rnQc5aafSQK1zulvPM-o5miv--DJ9ZKKwaLcAuA/exec"></iframe>
      </div>

      <div class="dashboard-card">
        <div class="card-header">
          <span>Painel 2 (Controle)</span>
          <a href="https://script.google.com/macros/s/AKfycbxDZysCb69Tr6XbG1gG3fplih8rDjZ3YfZ32moZUBxdkVeIdH4QL9vuGZ2lc1l3OY_L/exec" target="_blank">Abrir em nova aba ↗</a>
        </div>
        <iframe src="https://script.google.com/macros/s/AKfycbxDZysCb69Tr6XbG1gG3fplih8rDjZ3YfZ32moZUBxdkVeIdH4QL9vuGZ2lc1l3OY_L/exec"></iframe>
      </div>
    </div>
  </main>

  <script>
    function mostrarAba(idAba, elementoBotao) {
      // Oculta todas as telas
      const views = document.querySelectorAll('.view-container');
      views.forEach(view => view.classList.remove('active'));

      // Remove a classe 'active' de todos os botões
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));

      // Ativa a tela e o botão selecionado
      document.getElementById(idAba).classList.add('active');
      elementoBotao.classList.add('active');
    }
  </script>

</body>
</html>
